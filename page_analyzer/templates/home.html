<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Flask проект</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-dark content-left">
            <div class="d-flex gap-3 ps-3">
                <a class="nav-link link-light" href="{{ url_for('index') }}">Анализатор страниц</a>
                <a class="nav-link link-light" href="{{ url_for('get_urls') }}">Сайты</a>
            </div>
        </nav>
    </header>
        <div>
            {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}
        </div>
    <div class="container mt-5	bg-light p-5 rounded">
    <h1 class="display-4">{{ title }}</h1>
    <h3 class="lead">Бесплатно проверяйте сайты на SEO пригодность</h3>
    <form action="/" method="post">

        <div class="input-group">
            <input type="text"
                class="form-control"
                name="url"
                placeholder="https://example.com"
                required>
            <button type="submit" class="btn btn-primary ms-2">Проверить</button>
        </div>
    </form>
    </div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
