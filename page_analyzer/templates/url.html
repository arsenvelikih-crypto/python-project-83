<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Flask проект</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-dark content-left">
            <div class="d-flex gap-3 ps-3">
                <a class="nav-link link-light" href="/">Анализатор страниц</a>
                <a class="nav-link link-light" href="{{ url_for('get_urls') }}">Сайты</a>
            </div>
        </nav>
    </header>
<div class="container mt-1 p-1">
<h1>Сайт: {{ url[1] }}</h1>
<table data-test="url" class="table w-100 border-collapse mt-4 w-full">
    <tbody>
        <tr>
            <th class="border px-3 py-2">ID</th>
            <td class="border px-3 py-2">{{ url[0]}}</td>
        </tr>
        <tr>
            <th class="border px-3 py-2">Имя</th>
            <td class="border px-3 py-2">{{ url[1]}}</td>
        </tr>
        <tr>
            <th class="border px-3 py-2">Дата создания</th>
            <td class="border px-3 py-2">{{ url[2].strftime('%d.%m.%Y')}}</td>
        </tr>
    </tbody>
</table>
</div>
<div class="container mt-1 p-1">
    <h2>Проверки</h2>
    <button type="submit" class="btn btn-primary">Запустить проверку</button>
    <table data-test="urls" class="table w-100 border-collapse mt-2 w-full">
        <tr class="border px-3 py-2">
            <td class="border px-3 py-2">ID</td>
            <td class="border px-3 py-2">Код ответа</td>
            <td class="border px-3 py-2">h1</td>
            <td class="border px-3 py-2">title</td>
            <td class="border px-3 py-2">description</td>
            <td class="border px-3 py-2">Дата создания</td>
        </tr>
    </table>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
