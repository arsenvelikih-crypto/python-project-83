[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "validators>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
exclude = [
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
]
